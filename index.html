  <style>
    :root {
      --ink: #181817;
      --paper: #f2f0e9;
      --stone: #d9d6cb;
      --lime: #d7ff47;
      --muted: #6f6c63;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      width: 100%;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--paper);

      align-items: center;
      gap: .65rem;
      text-decoration: none;
      transition: gap 200ms ease, transform 200ms ease;
    }
    .arrow-link:hover { gap: 1rem; transform: translateX(3px); }
    .hero-image-frame {
      clip-path: polygon(8% 0, 100% 0, 100% 90%, 91% 100%, 0 100%, 0 9%);
    }
    .project-card {
      transition: transform 240ms ease, box-shadow 240ms ease;
    }
    .project-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 22px 40px rgba(24, 24, 23, .13);
    }
    .project-card img { transition: transform 500ms ease; }
    .project-card:hover img { transform: scale(1.045); }
    .reveal {
      animation: rise-in 700ms cubic-bezier(.2,.8,.2,1) both;
    }
    .reveal-delay { animation-delay: 130ms; }
    .reveal-delay-2 { animation-delay: 240ms; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 767px) {
      .hero-image-frame { clip-path: none; }
    }
  </style>
