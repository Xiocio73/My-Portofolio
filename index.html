<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portofolio!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding-bottom: 40px;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
    }
    section {
      margin-top: 40px;
    }
    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .card h3 {
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    .card p {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Xiocio</h1>
      <p class="subtitle">Desainer / Developer / Kreator</p>
    </header>

    <section id="about">
      <h2>Tentang Saya</h2>
      <div class="card">
        <p>i like design edit video and sketch!</p>
      </div>
    </section>

    <section id="projects">
      <h2>Proyek & Karya</h2>
      <div class="card">
        <h3>xio 1</h3>
        <p>THIS is my masterpiece</p>
      </div>
      <div class="card">
        <h3>xio 2</h3>
        <p>Deskripsi singkat karya lainnya.</p>
      </div>
    </section>
  </div>

</body>
</html>
